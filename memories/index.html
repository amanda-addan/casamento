<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eternize nossas memórias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: linear-gradient(160deg, #fdf8f3 0%, #f3e6dc 100%);
      color: #5b4a42;
      font-family: "Montserrat", -apple-system, sans-serif;
      text-align: center;
    }
    .card { max-width: 420px; }
    .ornament { font-size: 34px; color: #c9a27e; margin-bottom: 8px; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      font-size: 44px;
      line-height: 1.1;
      margin: 0 0 20px;
      color: #4a3a33;
    }
    p { font-size: 16px; line-height: 1.6; margin: 0 0 32px; }
    .btn {
      display: inline-block;
      padding: 18px 34px;
      background: #b98a64;
      color: #fff;
      font-weight: 600;
      font-size: 17px;
      text-decoration: none;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(185, 138, 100, 0.35);
      transition: transform .15s ease, background .15s ease;
    }
    .btn:hover, .btn:active { background: #a67852; transform: translateY(-1px); }
    .hint { margin-top: 24px; font-size: 13px; color: #8c7a70; }
  </style>
</head>
<body>
  <main class="card">
    <div class="ornament">♡</div>
    <h1>Eternize nossas memórias</h1>
    <p>
      Cada foto e cada vídeo seu faz parte da nossa história.
      Toque no botão abaixo e compartilhe os seus registros deste dia tão especial.
    </p>
    <a class="btn" href="https://drive.google.com/drive/folders/1YdfahtmqoSLOfqBcJbeAriK5TsspiCQx?usp=sharing">
      Enviar fotos e vídeos
    </a>
    <div class="hint">Obrigado por celebrar com a gente!</div>
  </main>
</body>
</html>
